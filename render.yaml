# Render 블루프린트 — GitHub 저장소를 연결하면 이 설정대로 웹 서비스가 만들어집니다.
# 무료 플랜: 15분간 접속이 없으면 잠들고, 다음 접속 때 약 1분 뒤 깨어납니다.
#            디스크가 유지되지 않아 재시작 때마다 처음부터 다시 수집합니다(검증용으로는 충분).
services:
  - type: web
    name: ipo-radar
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: IPO_RADAR_ADMIN_CODE      # 관리자 접속 코드(8자 이상) → 관리자 모드
        sync: false
      - key: IPO_RADAR_USER_CODE       # 이용자(부서원) 접속 코드(6자 이상) → 이용자 모드. 관리자 화면에서도 변경 가능
        sync: false
      - key: RENDER_API_KEY            # (선택) 관리자 화면에서 바꾼 이용자 코드를 Render 설정에도 저장해 재시작 후에도 유지
        sync: false
      - key: IPO_RADAR_BRAND           # 1=건대역지점 화면, 0=로고 없는 일반 화면
        value: "1"
      - key: GEMINI_API_KEY            # Google Gemini API (AI 요약·주간 AI 브리핑) — aistudio.google.com에서 무료 발급
        sync: false
      - key: IPO_RADAR_AI_PROVIDER     # gemini(기본) 또는 claude
        value: "gemini"
      - key: IPO_RADAR_AI_MODEL        # auto = 쓸 수 있는 Gemini Flash-Lite/Flash 자동 선택(모델 이름 직접 지정 가능)
        value: "auto"
      - key: DART_API_KEY
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
