<title>IPO Radar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Roboto+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: 증권사 지점 상담 데스크 — 로고 헤더 · 갈색 내비게이션 · '오늘' 업무판 → 목록·캘린더·계산기 → 우측 종목 상담 패널 */
:root{
  --bg:#f6f4f1; --surface:#ffffff; --surface-2:#f2eeea; --line:#e4ddd5; --line-strong:#cfc4b8;
  --ink:#231815; --ink-2:#5a4c44; --ink-3:#8a7c72;
  --brand:#692c00; --brand-2:#8a4a1c; --brand-ink:#ffffff; --brand-soft:#f6ebe1; --gold:#b8873f;
  --good:#1e7a4c; --good-soft:#e3f2ea; --warn:#a35a00; --warn-soft:#fcefd8; --bad:#b3261e; --bad-soft:#fbe4e1;
  --hold:#6b6460; --hold-soft:#eeebe8; --sample:#5b47b8; --sample-soft:#edeafa;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#8a94a3; --s5:#e87ba4; --s6:#692c00;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  --f-num:"Roboto Mono",ui-monospace,Consolas,monospace;
  --r:4px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141110; --surface:#1d1917; --surface-2:#26201d; --line:#352c27; --line-strong:#4a3e37;
  --ink:#f1ebe6; --ink-2:#c9bdb4; --ink-3:#998b81; --brand:#8a4a1c; --brand-2:#c9895a; --brand-ink:#ffffff; --brand-soft:#33231a; --gold:#d6a65c;
  --good:#52c08a; --good-soft:#15301f; --warn:#e5a54d; --warn-soft:#382711; --bad:#f07f74; --bad-soft:#3d1b18;
  --hold:#ada49e; --hold-soft:#2a2421; --sample:#a898f0; --sample-soft:#28223f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#7d8796; --s5:#d55181; --s6:#c9895a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141110; --surface:#1d1917; --surface-2:#26201d; --line:#352c27; --line-strong:#4a3e37;
  --ink:#f1ebe6; --ink-2:#c9bdb4; --ink-3:#998b81; --brand:#8a4a1c; --brand-2:#c9895a; --brand-ink:#ffffff; --brand-soft:#33231a; --gold:#d6a65c;
  --good:#52c08a; --good-soft:#15301f; --warn:#e5a54d; --warn-soft:#382711; --bad:#f07f74; --bad-soft:#3d1b18;
  --hold:#ada49e; --hold-soft:#2a2421; --sample:#a898f0; --sample-soft:#28223f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#7d8796; --s5:#d55181; --s6:#c9895a; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;letter-spacing:-.01em}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1280px;margin:0 auto}
a{color:var(--brand-2)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:0}
h1,h2,h3,h4{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
.muted{color:var(--ink-3)} .small{font-size:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.hd{background:var(--surface);border-bottom:1px solid var(--line)}
.hd .in{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;padding-block:14px}
.id{display:flex;align-items:center;gap:14px;min-width:0;flex-wrap:wrap}
.id img{height:30px;width:auto;display:block}
.id .div{width:1px;height:26px;background:var(--line-strong)}
@media (max-width:560px){.id .div{display:none}.id{gap:8px 14px}}
.id .br{font-weight:800;font-size:19px;color:var(--ink);letter-spacing:-.02em}
.id .svc{font-size:12.5px;color:var(--ink-3);display:block;font-weight:500;letter-spacing:0}
.wordmark{font-weight:800;font-size:20px;color:var(--brand)}
.hmeta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:12px;color:var(--ink-2)}
.toggle{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:999px;padding:4px 11px;background:var(--surface)}
.toggle input{accent-color:var(--sample);margin:0}
.nav{background:var(--brand);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.nav .in{display:flex;overflow-x:auto;scrollbar-width:none}
.nav button{background:none;border:0;color:rgba(255,255,255,.78);padding:12px 16px;font-weight:500;white-space:nowrap;border-bottom:3px solid transparent;font-size:14px}
.nav button:hover{color:#fff}
.nav button[aria-selected="true"]{color:#fff;font-weight:700;border-bottom-color:var(--gold)}
main .in{display:grid;gap:18px;padding-block:20px 48px}
.banner{border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:var(--r);display:grid;gap:3px;font-size:13px}
.banner.err{border-left-color:var(--bad);background:var(--bad-soft)}
.banner.sample{border-left-color:var(--sample);background:var(--sample-soft)}
.banner b{font-weight:700}
.linkbtn{background:none;border:0;padding:0;color:var(--brand-2);text-decoration:underline;text-underline-offset:3px;font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;min-width:0;align-content:start}
.card>.ch{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:13px 16px;border-bottom:1px solid var(--line)}
.card>.ch h2{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.card>.ch h2::before{content:"";width:4px;height:16px;background:var(--brand);border-radius:1px}
.card>.cb{padding:14px 16px;display:grid;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px;align-items:start} @media (max-width:960px){.grid2{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.kpi{padding:14px 16px;display:grid;gap:3px;align-content:start;min-width:0;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0}
.kpi .lab{font-size:12px;color:var(--ink-2);font-weight:500}
.kpi .val{font-family:var(--f-num);font-size:28px;font-weight:600;line-height:1.15;color:var(--ink)}
.kpi .val small{font-size:13px;color:var(--ink-3);font-family:var(--f-body);font-weight:500}
.kpi .det{font-size:12px;color:var(--ink-2);overflow-wrap:anywhere}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}}
.todo .grp{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.todo .grp:first-child{border-top:0;padding-top:0}
.todo .gl{font-size:12.5px;font-weight:700;color:var(--ink-2);display:flex;flex-direction:column;gap:2px}
.todo .gl .num{font-size:11.5px;font-weight:400;color:var(--ink-3)}
.todo .items{display:flex;flex-direction:column;gap:6px;min-width:0}
.ti{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;min-width:0}
.ti .nm{font-weight:700;background:none;border:0;padding:0;text-align:left;color:var(--ink);font-size:14px}
.ti .nm:hover{color:var(--brand-2);text-decoration:underline}
@media (max-width:560px){.todo .grp{grid-template-columns:1fr;gap:6px}}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;line-height:1;padding:4px 7px;border-radius:3px;border:1px solid transparent;white-space:nowrap;font-weight:500}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.hold{background:var(--hold-soft);color:var(--hold)}
.chip.info{background:var(--brand-soft);color:var(--brand-2)} .chip.sample{background:var(--sample-soft);color:var(--sample)}
.chip.line{border-color:var(--line-strong);color:var(--ink-2);background:var(--surface)}
.chip.house{background:var(--brand);color:var(--brand-ink);font-weight:700}
button.chip:hover{border-color:var(--brand-2)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:6px 11px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--brand-2);color:var(--brand-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{background:var(--brand-2);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.pick{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:7px;background:var(--surface);text-align:left;align-content:start}
.pick:hover{border-color:var(--brand-2);box-shadow:0 1px 0 var(--brand-2)}
.pick .nm{font-weight:700;font-size:15px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pick ul{margin:0;padding-left:16px;display:grid;gap:2px;font-size:13px}
.pick .lbl{font-size:11px;color:var(--ink-3);font-weight:700}
.pick .dates{font-size:12.5px;color:var(--ink-2)}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;font-size:13px}
.mini h3{font-size:12px;color:var(--ink-2);font-weight:700;margin-bottom:4px}
.mini ul{margin:0;padding-left:16px}
.filters{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.filters label{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink-2)}
select,input[type=search],input[type=number],input[type=text],textarea{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);color:var(--ink)}
input[type=search]{width:170px}
input[type=checkbox]{accent-color:var(--brand)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;font-weight:700;color:var(--ink-2);background:var(--surface-2);white-space:nowrap;border-bottom:1px solid var(--line-strong)}
td.r,th.r{text-align:right} tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.cname{font-weight:700;background:none;border:0;padding:0;text-align:left;color:var(--ink)}
.cname:hover{color:var(--brand-2);text-decoration:underline}
.delta-up{color:var(--good)} .delta-dn{color:var(--bad)}
.empty{padding:26px;text-align:center;color:var(--ink-2);display:grid;gap:6px;justify-items:center}
.empty b{color:var(--ink)}
.cal-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);background:var(--line);gap:1px;min-width:560px}
.cal .dow{background:var(--surface-2);font-size:12px;padding:6px;text-align:center;color:var(--ink-2);font-weight:700}
.cal .dow:first-child{color:var(--bad)}
.cal .day{background:var(--surface);min-height:96px;padding:5px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .day.out{background:var(--bg)} .cal .day.today{box-shadow:inset 0 0 0 2px var(--brand)}
.cal .dn{font-size:12px;color:var(--ink-3);font-family:var(--f-num)}
.ev{font-size:11.5px;line-height:1.3;padding:2px 5px;border-radius:2px;border:0;border-left:3px solid var(--s4);background:var(--surface-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;width:100%}
.ev.sched\.demand_forecast{border-left-color:var(--s1)} .ev.sched\.subscription{border-left-color:var(--s2);font-weight:700}
.ev.sched\.listing{border-left-color:var(--s3)} .ev.sched\.refund{border-left-color:var(--s5)} .ev.sched\.payment{border-left-color:var(--s4)} .ev.sched\.price_fix{border-left-color:var(--s6)}
.ev.house{background:var(--brand-soft)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.weeklist{display:grid;gap:6px}
.weeklist .row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px} @media (max-width:820px){.calc{grid-template-columns:1fr}}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:12.5px;color:var(--ink-2);font-weight:500}
.form .hint{font-size:11.5px;color:var(--ink-3);font-weight:400}
.res{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);padding:14px 16px;display:grid;gap:10px;align-content:start}
.res .big{font-family:var(--f-num);font-size:30px;font-weight:600;color:var(--brand-2)}
.res .row{display:flex;justify-content:space-between;gap:10px;font-size:13px;border-top:1px solid var(--line);padding-top:8px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-3);font-family:var(--f-body);font-size:11px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--line-strong);stroke-width:1}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:3px;z-index:60;max-width:260px;line-height:1.4}
.scrim{position:fixed;inset:0;background:rgba(35,24,21,.38);z-index:30}
aside.panel{position:fixed;top:0;right:0;bottom:0;width:min(860px,100%);background:var(--bg);z-index:40;overflow-y:auto;border-left:1px solid var(--line);
  padding:env(safe-area-inset-top,0px) max(18px,env(safe-area-inset-right,0px)) 40px 18px}
.panel-h{position:sticky;top:0;background:var(--surface);margin:0 -18px;padding:14px 18px 12px;border-bottom:2px solid var(--brand);display:grid;gap:8px;z-index:2}
.panel-h .t{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.panel-h h2{font-size:22px;font-weight:800}
.panel section{margin-top:18px;display:grid;gap:8px}
.panel h3{font-size:14.5px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-bottom:6px;border-bottom:1px solid var(--line)}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:7px 12px;font-size:13px}
.kv>div:nth-child(odd){color:var(--ink-2)}
@media (max-width:560px){.kv{grid-template-columns:1fr}.kv>div:nth-child(odd){margin-top:6px;font-weight:700}}
.src{font-size:11.5px;color:var(--ink-3);display:block;margin-top:1px}
.src a{color:var(--ink-3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px} @media (max-width:640px){.two{grid-template-columns:1fr}}
.pr{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface);display:grid;gap:6px;align-content:start}
.pr ol{margin:0;padding-left:18px;display:grid;gap:6px;font-size:13px}
.pr h4{font-size:12.5px}
.notice{border:1px solid var(--brand-2);background:var(--brand-soft);border-radius:var(--r);padding:10px 12px;font-size:12.5px}
.bar{height:8px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--brand-2);border-radius:0 2px 2px 0}
.comp{display:grid;grid-template-columns:92px 1fr 48px 52px;gap:8px;align-items:center;font-size:12.5px}
.sent{display:flex;height:10px;border-radius:2px;overflow:hidden;gap:2px}
.sent span{display:block;height:100%}
details{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:8px 12px}
details summary{cursor:pointer;font-size:13px;color:var(--ink-2)}
.score-big{font-family:var(--f-num);font-size:30px;font-weight:600}
textarea{width:100%;min-height:150px;resize:vertical;font-size:12.5px;line-height:1.6}
.foot{font-size:11.5px;color:var(--ink-3);display:grid;gap:4px;border-top:1px solid var(--line);padding-top:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:3px;font-size:13px;z-index:70}
@media (prefers-reduced-motion:no-preference){aside.panel{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
/* 주간 캘린더 */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.wd{background:var(--surface);display:flex;flex-direction:column;min-width:0;min-height:170px}
.wd.weekend{background:var(--bg)}
.wd.is-today{box-shadow:inset 0 0 0 2px var(--brand)}
.wh{display:flex;align-items:baseline;gap:6px;padding:8px 9px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-2)}
.wh b{font-size:15px;color:var(--ink)}
.wd.weekend .wh span:first-child{color:var(--bad)}
.wb{display:flex;flex-direction:column;gap:5px;padding:7px}
.wb .none{font-size:11.5px;color:var(--ink-3);padding:4px 2px}
.wev{display:grid;grid-template-columns:1fr auto;gap:1px 4px;text-align:left;border:1px solid var(--line);border-left:4px solid var(--s4);border-radius:3px;background:var(--surface);padding:5px 7px;min-width:0}
.wev:hover{border-color:var(--brand-2)}
.wev .t{font-size:10.5px;color:var(--ink-3);font-weight:700;grid-column:1}
.wev .n{font-size:13px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;grid-column:1}
.wev .h{grid-column:2;grid-row:1/3;align-self:center;font-size:10.5px;font-weight:700;color:var(--brand-ink);background:var(--brand);border-radius:2px;padding:2px 4px}
.wev.sched-demand_forecast{border-left-color:var(--s1)} .wev.sched-subscription{border-left-color:var(--s2);background:var(--warn-soft)}
.wev.sched-listing{border-left-color:var(--s3)} .wev.sched-refund{border-left-color:var(--s5)} .wev.sched-payment{border-left-color:var(--s4)} .wev.sched-price_fix{border-left-color:var(--s6)}
@media (max-width:860px){.week{grid-template-columns:1fr}.wd{min-height:0;flex-direction:row}.wh{flex-direction:column;align-items:flex-start;border-bottom:0;border-right:1px solid var(--line);width:64px;flex:none}.wb{flex:1}}
/* 이번 주 기업 카드 */
.cos{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.co{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;align-content:start;background:var(--surface)}
.co-h{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.co-h .nm{font-size:16px;font-weight:800;background:none;border:0;padding:0;color:var(--ink)}
.co-h .nm:hover{color:var(--brand-2);text-decoration:underline}
.co-s{margin:0;font-size:13px;color:var(--ink-2);line-height:1.55}
.co-k{display:grid;grid-template-columns:72px minmax(0,1fr);gap:4px 10px;margin:0;font-size:12.5px;border-top:1px solid var(--line);padding-top:10px}
.co-k dt{color:var(--ink-3)} .co-k dd{margin:0;color:var(--ink);font-weight:500}
/* 상세 */
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
.keys>div{padding:8px 10px;display:grid;gap:2px;border-left:1px solid var(--line);min-width:0}
.keys>div:first-child{border-left:0}

  --brand:#692c00;--brand-2:#8a4a1c;--brand-soft:#f6ebe1;--gold:#b8873f;--good:#1e7a4c;--good-soft:#e3f2ea;--warn:#a35a00;--warn-soft:#fcefd8;--bad:#b3261e;--bad-soft:#fbe4e1;

</style>

<div id="root"></div>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
const DATA = /*__IPO_RADAR_DATA__*/null;
(function(){
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const root = $("#root"), tip = $("#tip"), toast = $("#toast");
if(!DATA){ root.innerHTML = `<div class="empty gut"><b>데이터가 없습니다</b><span>python -m ipo_radar run 으로 수집을 실행하면 이 화면이 채워집니다.</span></div>`; return; }
const BRAND = DATA.meta.brand || null;
const ADMIN = (DATA.meta.role || "admin") !== "viewer";  // 이용자 모드에서는 관리 기능·오류 정보를 숨김
if(BRAND) document.documentElement.dataset.brand = "1";
const HOUSE = BRAND ? BRAND.house : null;
const FRAMED = (()=>{ try{ return window.self!==window.top; }catch(e){ return true; } })();
const NS = "ipo-radar:" + (BRAND ? BRAND.branch : "default") + ":";
const store = { get(k,d){ try{ const v = localStorage.getItem(NS+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
                set(k,v){ try{ localStorage.setItem(NS+k, JSON.stringify(v)); }catch(e){} } };

const kstDate = d => { const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(d).map(x=>[x.type,x.value])); return `${p.year}-${p.month}-${p.day}`; };
const NOW_KST = kstDate(new Date());
const today = NOW_KST >= DATA.meta.today ? NOW_KST : DATA.meta.today;
const S = { showSample: store.get("showSample", false), tab: store.get("tab","home"), period: 90, sector:"", stage:"", verdict:"",
            kind:"general", soon:false, minInterest:"", onlyWatch:false, onlyHouse:false, q:"", sel:new Set(), detail:null,
            calMonth: today.slice(0,7), calView:"month", watch:new Set(store.get("watch", (DATA.watchlist||[]).map(w=>w.uid))),
            calc:{uid:"", price:"", shares:"", rate:"50", ratio:"", minSh:""}, week:0, dtab:"overview" };

const DOW = ["일","월","화","수","목","금","토"];
const EVENT = {"sched.demand_forecast":"수요예측","sched.price_fix":"공모가 확정","sched.subscription":"청약","sched.refund":"환불","sched.payment":"납입","sched.listing":"상장"};
const VCLASS = {"상대적 저평가 가능성":"good","적정 범위":"info","상대적 고평가 가능성":"bad","판단 유보":"hold"};
const VICON = {"상대적 저평가 가능성":"▼","적정 범위":"●","상대적 고평가 가능성":"▲","판단 유보":"–"};
const STAGE_CLASS = {subscription:"warn", demand_forecast:"info", pre_listing:"info", filed:"line", watch:"hold", postponed:"bad", withdrawn:"bad", listed:"good"};
const REL_CLASS = {"높음":"good","보통":"info","낮음":"warn","예시":"sample","산출 불가":"hold"};
const BASIS = {confirmed:"확인 실적·공시", company_projection:"회사 전망", company_claim:"회사 주장", news_reported:"보도 내용", analyst_estimate:"분석자 추정"};
const STYPE = {official_disclosure:"공식 공시", exchange:"거래소", underwriter:"주관사", aggregator:"집계 사이트", aggregator_unofficial:"비공식 집계", news:"뉴스", websearch_summary:"웹검색 요약", manual:"수동 입력", sample:"예시(가상)"};

const md = s => { if(!s) return "–"; const d = new Date(s+"T00:00:00"); return `${d.getMonth()+1}.${d.getDate()}(${DOW[d.getDay()]})`; };
const rng = v => !v ? "–" : (v.start && v.end && v.start!==v.end ? `${md(v.start)}~${md(v.end)}` : md(v.start||v.end));
const won = v => v==null||v==="" ? "–" : Math.round(Number(v)).toLocaleString("ko-KR")+"원";
const krw = v => { if(v==null) return "–"; const a=Math.abs(v); if(a>=1e12) return (v/1e12).toFixed(2)+"조원"; if(a>=1e8) return Math.round(v/1e8).toLocaleString("ko-KR")+"억원"; return Math.round(v).toLocaleString("ko-KR")+"원"; };
const pct = (v,d=0) => v==null ? "–" : (v*100).toFixed(d)+"%";
const sgn = (v,d=1) => v==null ? "–" : (v>0?"+":"")+(v*100).toFixed(d)+"%";
const KSTF = new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false});
const ago = iso => { if(!iso) return "–"; const d = new Date(iso); if(isNaN(d)) return String(iso); const p = Object.fromEntries(KSTF.formatToParts(d).map(x=>[x.type,x.value])); return `${p.month}.${p.day} ${p.hour}:${p.minute}`; };
const addDays = (s,n) => { const d=new Date(s+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const byUid = Object.fromEntries(DATA.companies.map(c=>[c.uid,c]));
const isHouse = c => !!(HOUSE && c && (c.underwriters||"").includes(HOUSE));
const houseChip = c => isHouse(c) ? `<span class="chip house" title="${esc(HOUSE)} 대표주관 — 당사 계좌로 청약 가능">당사 주관</span>` : "";
const srcChip = it => {
  if(!it || !it.source) return `<span class="src">출처 없음</span>`;
  const s = it.source;
  return `<span class="src">${esc(STYPE[s.type]||s.type)} · <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.publisher||"원문")}</a>${it.as_of?` · 기준 ${esc(it.as_of)}`:""} · 수집 ${esc(ago(it.collected_at))}${it.basis?` · ${esc(BASIS[it.basis]||it.basis)}`:""}</span>`;
};
const vchip = v => `<span class="chip ${VCLASS[v]||"hold"}">${VICON[v]||"–"} ${esc(v)}</span>`;
const flash = msg => { toast.textContent = msg; toast.hidden = false; clearTimeout(flash.t); flash.t = setTimeout(()=>toast.hidden=true, 2400); };
function download(name, text, type){
  if(FRAMED){ flash("내보내기는 지점 PC에서 연 대시보드 파일에서 사용할 수 있습니다"); return; }
  const url = URL.createObjectURL(new Blob([text], {type}));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000); flash(name + " 저장");
}
async function copyText(text, el){
  try{ await navigator.clipboard.writeText(text); flash("복사했습니다"); }
  catch(e){ if(el){ el.focus(); el.select(); } flash("자동 복사가 막혀 있습니다. 선택된 글을 Ctrl+C로 복사하세요"); }
}

function rows(){ return DATA.companies.filter(c => (S.showSample || !c.is_sample)); }
function firstDate(c){ for(const k of ["sched.demand_forecast","sched.subscription","sched.listing"]){ const v=c.sched[k]; if(v&&(v.start||v.end)) return v.start||v.end; } return null; }
function filtered(){
  const end = addDays(today, S.period);
  return rows().filter(c=>{
    if(S.kind && c.kind!==S.kind) return false;
    if(S.sector && (c.sector||"미분류")!==S.sector) return false;
    if(S.stage && c.stage!==S.stage) return false;
    if(S.verdict && c.verdict!==S.verdict) return false;
    if(S.onlyWatch && !S.watch.has(c.uid)) return false;
    if(S.onlyHouse && !isHouse(c)) return false;
    if(S.q && !c.name.includes(S.q)) return false;
    if(S.minInterest!=="" && !(c.interest_score!=null && c.interest_score>=+S.minInterest)) return false;
    const sub = c.sched["sched.subscription"];
    if(S.soon && !(sub && sub.start && sub.start<=addDays(today,7) && (sub.end||sub.start)>=today)) return false;
    const f = firstDate(c);
    if(f && f>end) return false;
    return true;
  }).sort((a,b)=> (firstDate(a)||"9999") < (firstDate(b)||"9999") ? -1 : 1);
}

function notice(c){
  const r = DATA.reports[c.uid] || {}; const sc = c.sched;
  const price = c.price_final!=null ? `확정 공모가 ${won(c.price_final)}` : c.price_band ? `희망 공모가 ${Number(c.price_band.low).toLocaleString()}~${Number(c.price_band.high).toLocaleString()}원 (확정 전)` : "공모가 미정";
  const L = [`[공모주 안내] ${c.name}${c.is_sample?" (예시 데이터)":""}`, ""];
  if(sc["sched.subscription"]) L.push(`· 청약일: ${rng(sc["sched.subscription"])}`);
  if(sc["sched.price_fix"]) L.push(`· 공모가 확정: ${rng(sc["sched.price_fix"])}`);
  if(sc["sched.refund"]) L.push(`· 환불일: ${rng(sc["sched.refund"])}`);
  L.push(`· 상장 예정일: ${sc["sched.listing"]?rng(sc["sched.listing"]):"미정"}`);
  L.push(`· ${price}`);
  if(c.underwriters) L.push(`· 주관사: ${c.underwriters}`);
  if(c.sector) L.push(`· 업종: ${c.sector}`);
  if(c.min_subscription) L.push(`· 최소 청약: ${Number(c.min_subscription).toLocaleString()}주`);
  if(c.deposit_rate!=null) L.push(`· 청약 증거금률: ${pct(c.deposit_rate)}`);
  const pts = (r.summary||{}).points||[], rks = (r.summary||{}).risks||[];
  if(pts.length){ L.push("", "■ 참고 포인트"); pts.forEach(p=>L.push(`- ${p.text} (${BASIS[p.basis]||p.basis})`)); }
  if(rks.length){ L.push("", "■ 유의 사항"); rks.forEach(p=>L.push(`- ${p.text} (${BASIS[p.basis]||p.basis})`)); }
  L.push("");
  if(isHouse(c)) L.push(`※ ${HOUSE}는 본 공모의 대표주관회사로서 이해관계가 있습니다.`);
  L.push("※ 공개 자료를 정리한 참고 안내이며 투자 권유가 아닙니다. 공모주는 원금 손실이 발생할 수 있고 예금자보호법에 따라 보호되지 않습니다. 청약 전 투자설명서를 반드시 확인하시기 바랍니다.");
  if(BRAND) L.push(`${BRAND.house} ${BRAND.branch}`);
  return L.join("\n");
}
function icsFor(list){
  const out = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//IPO Radar//KO","CALSCALE:GREGORIAN","X-WR-CALNAME:공모주 일정"];
  list.forEach(e=>{ out.push("BEGIN:VEVENT",`UID:${e.uid}-${e.event}@ipo-radar`,`DTSTAMP:${DATA.meta.generated_at.replace(/[-:]/g,"").slice(0,15)}`,
    `DTSTART;VALUE=DATE:${e.start.replace(/-/g,"")}`,`DTEND;VALUE=DATE:${addDays(e.end,1).replace(/-/g,"")}`,`SUMMARY:[${EVENT[e.event]}] ${e.name}`,"END:VEVENT"); });
  out.push("END:VCALENDAR"); return out.join("\r\n");
}
function csvFor(list){
  const q = v => `"${String(v??"").replace(/"/g,'""')}"`;
  const h = ["기업명","업종","단계","공모가 확정","청약","환불","상장예정","희망공모가","확정공모가","주관사","당사 주관","관심도","가치평가","데이터 신뢰도","예시"];
  const lines = list.map(c=>[c.name,c.sector,c.stage_label,rng(c.sched["sched.price_fix"]),rng(c.sched["sched.subscription"]),rng(c.sched["sched.refund"]),rng(c.sched["sched.listing"]),
    c.price_band?`${c.price_band.low}~${c.price_band.high}`:"",c.price_final??"",c.underwriters,isHouse(c)?"Y":"",c.interest_score??"산출 불가",c.verdict,c.reliability,c.is_sample?"Y":""].map(q).join(","));
  return "﻿" + [h.map(q).join(","), ...lines].join("\r\n");
}

const TABS = [["home","이번 주"],["list","공모주 목록"],["calendar","청약 캘린더"],["compare","적정가 비교"],["calc","증거금 계산기"],["changes","변경 이력"]]
  .concat(ADMIN ? [["sources","데이터 관리 · 관리자"]] : []);
if(!TABS.some(([k])=>k===S.tab)) S.tab = "home";
function header(){
  const lr = DATA.meta.last_run;
  const id = BRAND ? `<div class="id">${BRAND.logo_data?`<img src="${BRAND.logo_data}" alt="${esc(BRAND.house)}">`:`<span class="wordmark">${esc(BRAND.house)}</span>`}<span class="div"></span>
      <span class="br">${esc(BRAND.branch)}<span class="svc">공모주 상담 데스크 · IPO Radar</span></span></div>`
    : `<div class="id"><span class="wordmark">IPO Radar</span><span class="div"></span><span class="br" style="font-size:15px">공모주 상담 데스크<span class="svc">국내 상장 예정 기업 · 향후 90일</span></span></div>`;
  return `<header class="hd gut"><div class="in">${id}
    <div class="hmeta"><span>데이터 기준 <b class="num">${esc(ago(DATA.meta.generated_at))}</b> (KST)</span>
      ${ADMIN?`<span class="chip ${lr&&lr.status==="success"?"good":lr&&lr.status==="failed"?"bad":"warn"}">${esc(lr?({success:"수집 정상",partial:"일부 자료원 미연결",failed:"수집 실패",running:"수집 중"}[lr.status]||lr.status):"기록 없음")}</span>`:""}
      <span>자동 갱신: 매주 월 08:00</span>
      <label class="toggle"><input type="checkbox" id="tg-sample" ${S.showSample?"checked":""}> 예시 데이터 보기</label></div></div></header>
  <nav class="nav gut" aria-label="메뉴"><div class="in" role="tablist">${TABS.map(([k,l])=>`<button role="tab" aria-selected="${S.tab===k}" data-tab="${k}">${l}</button>`).join("")}</div></nav>`;
}
function banners(){
  const srcs = DATA.sources, bad = srcs.filter(s=>["error","blocked"].includes(s.status)), nc = srcs.filter(s=>s.status==="not_configured");
  const daysOld = Math.round((new Date(today+"T00:00:00") - new Date(DATA.meta.today+"T00:00:00"))/864e5);
  let h = "";
  if(daysOld > DATA.meta.stale_days) h += `<div class="banner err"><b>데이터가 ${daysOld}일 지났습니다</b><span>마지막 수집 ${esc(DATA.meta.today)}. ${ADMIN?"‘데이터 관리’에서 주간 자동 실행 상태를 확인하세요. ":""}일정이 바뀌었을 수 있으니 고객 안내 전에 DART 공시를 확인하세요.</span></div>`;
  if(ADMIN && (bad.length||nc.length)) h += `<div class="banner"><b>일부 자료원을 아직 연결하지 못했습니다.</b>
    <span>연결되지 않은 자료는 웹검색 요약 등급(원문 미확인)으로 표시합니다. 수집하지 못한 값은 0이 아니라 ‘산출 불가’·‘판단 유보’로 표시합니다. <button class="linkbtn" data-tab="sources">연결 상태 보기</button></span></div>`;
  if(!ADMIN) h += `<div class="banner"><b>고객 안내 전 확인</b><span>일정·공모가는 DART 투자설명서로 반드시 확인하세요. ‘신뢰도 낮음’ 표시는 원문 확인 전 자료입니다.</span></div>`;
  if(S.showSample) h += `<div class="banner sample"><b>예시 데이터 표시 중</b><span>[예시]로 시작하는 기업은 기능 시연용 가상 데이터입니다. 상단 지표·오늘 할 일·주간 브리핑에는 포함하지 않습니다.</span></div>`;
  return h;
}

function weekRange(off){ const mon = addDays(today, -((new Date(today+"T00:00:00").getDay()+6)%7) + 7*off); return [...Array(7)].map((_,i)=>addDays(mon,i)); }
function weekCompanies(days){
  const a = days[0], b = days[6];
  return rows().filter(c=>c.kind==="general" && c.status!=="withdrawn").map(c=>{
    const evs = Object.entries(c.sched).filter(([k,v])=>v&&(v.start||v.end)&&(v.start||v.end)<=b&&(v.end||v.start)>=a).map(([k,v])=>({k,v}));
    return {c, evs};
  }).filter(x=>x.evs.length).sort((x,y)=>((x.evs.find(e=>e.k==="sched.subscription")||x.evs[0]).v.start||"") < ((y.evs.find(e=>e.k==="sched.subscription")||y.evs[0]).v.start||"") ? -1 : 1);
}

function todoGroups(){

    body = `<div class="weeklist">${[...Array(14)].map((_,i)=>addDays(mon,i)).map(d=>{ const es=on(d); return `<div class="row"><div><b class="num">${md(d)}</b>${d===today?` <span class="chip info">오늘</span>`:""}</div><div class="btns">${es.length?es.map(e=>`<span style="max-width:100%">${evBtn(e, `${EVENT[e.event]} · ${esc(e.name)}`)}</span>`).join(""):`<span class="muted small">일정 없음</span>`}</div></div>`; }).join("")}</div>`;
  } else {
    const [y,m] = S.calMonth.split("-").map(Number);
    const first = new Date(y, m-1, 1), start = new Date(first); start.setDate(1-first.getDay());
    let cells = DOW.map(d=>`<div class="dow">${d}</div>`).join("");
    for(let i=0;i<42;i++){
      const d = new Date(start); d.setDate(start.getDate()+i);
      const iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
      const es = on(iso).sort((a,b)=>(a.event==="sched.subscription"?0:1)-(b.event==="sched.subscription"?0:1));
      cells += `<div class="day ${d.getMonth()!==m-1?"out":""} ${iso===today?"today":""}"><span class="dn">${d.getDate()}</span>${es.slice(0,5).map(e=>evBtn(e, `${EVENT[e.event].slice(0,2)} ${esc(e.name)}`)).join("")}${es.length>5?`<span class="small muted">+${es.length-5}</span>`:""}</div>`;
    }
    body = `<div class="tbl-wrap" style="border:0"><div class="cal">${cells}</div></div>`;
  }
  const undated = rows().filter(c=>!firstDate(c) && (S.kind===""||c.kind===S.kind));
  return `<section class="card"><div class="ch"><h2>청약 캘린더</h2><div class="btns"><button class="btn" data-dl="ics">내 캘린더에 추가(.ics)</button></div></div>
    <div class="cb">${head}${legend}${body}
    <div><h3 style="font-size:13px;margin-bottom:6px">일정 미정 관찰 목록 (${undated.length})</h3>${undated.length?`<div class="btns">${undated.map(c=>`<button class="chip ${c.status==="postponed"?"bad":"line"}" data-open="${c.uid}">${esc(c.name)}${c.status==="postponed"?" · 연기":""}</button>`).join("")}</div>`:`<span class="muted">없음</span>`}</div></div></section>`;
}

function fairChip(c){
  if(c.verdict==="판단 유보") return `${vchip(c.verdict)}${c.forecast_dependency===1?`<span class="src">미래 추정 의존형</span>`:""}`;
  return `${vchip(c.verdict)}${c.verdict_provisional?` <span class="chip line">잠정</span>`:""}${c.fair_range?`<span class="src">적정가 ${Math.round(c.fair_range.low).toLocaleString()}~${Math.round(c.fair_range.high).toLocaleString()}원</span>`:""}`;
}
function fairGauge(v){
  const pts = [];
  (v.prices||[]).forEach(([l,p])=>pts.push({l,p,k:"price"}));
  if(v.actual_value) pts.push({l:"확인 실적 기준 가치",p:v.actual_value,k:"va"});
  if(v.underwriter_value && Math.abs(v.underwriter_value-(v.actual_value||0))>1) pts.push({l:"주관사 평가가액",p:v.underwriter_value,k:"vu"});
  const base = v.actual_value || (v.provisional ? v.underwriter_value : null);
  const fr = v.fair_range;
  const all = pts.map(x=>x.p).concat(fr?[fr.low,fr.high]:[]);
  const lo = Math.min(...all)*0.82, hi = Math.max(...all)*1.1, W=660, H=128, L=14, R=14, Y=60;
  const x = q => L + (q-lo)/(hi-lo)*(W-L-R);
  const zones = fr ? `<rect x="${L}" y="${Y-12}" width="${x(fr.low)-L}" height="24" fill="var(--good-soft)"/><rect x="${x(fr.low)}" y="${Y-12}" width="${x(fr.high)-x(fr.low)}" height="24" fill="var(--brand-soft)" stroke="var(--brand-2)"/><rect x="${x(fr.high)}" y="${Y-12}" width="${W-R-x(fr.high)}" height="24" fill="var(--bad-soft)"/>
    <text x="${(L+x(fr.low))/2}" y="${Y+4}" text-anchor="middle" style="fill:var(--good);font-weight:700">저평가 구간</text><text x="${(x(fr.low)+x(fr.high))/2}" y="${Y+4}" text-anchor="middle" style="fill:var(--brand-2);font-weight:700">적정 구간</text><text x="${(x(fr.high)+W-R)/2}" y="${Y+4}" text-anchor="middle" style="fill:var(--bad);font-weight:700">고평가 구간</text>`
    : `<rect x="${L}" y="${Y-12}" width="${W-L-R}" height="24" fill="var(--hold-soft)"/><text x="${W/2}" y="${Y+4}" text-anchor="middle" style="fill:var(--hold)">확인 실적 기준 가치를 계산할 수 없음</text>`;
  const marks = pts.map((m,i)=>{ const up = m.k!=="price"; const xx=x(m.p); const col = m.k==="price"?"var(--ink)":m.k==="va"?"var(--good)":"var(--ink-3)";
    return `<line x1="${xx}" x2="${xx}" y1="${up?Y-24:Y+12}" y2="${up?Y-12:Y+24}" stroke="${col}" stroke-width="2"/><text x="${Math.min(W-R, Math.max(L, xx))}" y="${up?Y-30-(i%2)*12:Y+38+(i%2)*12}" text-anchor="${xx<W*0.15?"start":xx>W*0.85?"end":"middle"}" style="fill:${col};font-weight:${m.k==="price"?700:500}">${esc(m.l)} ${Math.round(m.p).toLocaleString()}</text>`; }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="공모가와 적정가 구간">${zones}${marks}</svg>`;
}

  rs.sort((a,b)=>(b.v.eff_discount??-9)-(a.v.eff_discount??-9));
  return `<div class="tbl-wrap"><table><thead><tr><th>기업</th><th class="r">공모가</th><th class="r">확인 실적 기준 가치</th><th class="r">적정 공모가 범위</th><th class="r">실효 할인율</th><th>판정</th><th class="r">추정 의존도</th></tr></thead><tbody>
    ${rs.map(({c,v})=>`<tr><td><button class="cname" data-open="${c.uid}" data-goto="value">${esc(c.name)}</button>${houseChip(c)}${c.is_sample?` <span class="chip sample">예시</span>`:""}</td>
      <td class="r num">${won(v.price_used)}<span class="src">${esc(v.price_label)}</span></td>
      <td class="r num">${v.actual_value?won(v.actual_value):v.provisional?won(v.underwriter_value)+"*":"–"}</td>
      <td class="r num">${v.fair_range?`${Math.round(v.fair_range.low).toLocaleString()}~${Math.round(v.fair_range.high).toLocaleString()}`:"–"}</td>
      <td class="r num">${v.eff_discount!=null?sgn(-v.eff_discount,1).replace("+","할증 +").replace("-","할인 "):"–"}</td>
      <td>${vchip(v.verdict)}${v.provisional?` <span class="chip line">잠정</span>`:""}${v.verdict==="판단 유보"&&v.reference?`<span class="src">추정 인정 시: ${esc(v.reference.verdict)}</span>`:""}</td>
      <td class="r num">${v.forecast_dependency!=null?pct(v.forecast_dependency):"–"}</td></tr>`).join("")}</tbody></table></div>
    <span class="small muted">* 적용 이익 기준 미확인 — 주관사 평가가액으로 잠정 계산. 실효 할인율 = 1 − 공모가 ÷ 확인 실적 기준 가치. 30% 이상 저평가 가능성 / 15~30% 적정 / 15% 미만 고평가 가능성.</span>`;
}

const GRADE_CLASS = {"강함":"good","보통":"info","약함":"bad","발표 전":"hold"};
const demandChip = c => c.demand_grade && c.demand_grade!=="발표 전" ? `<span class="chip ${GRADE_CLASS[c.demand_grade]}">기관 수요 ${esc(c.demand_grade)} ${c.demand_score!=null?Math.round(c.demand_score):""}</span>` : `<span class="muted small">수요예측 전</span>`;
function trendChart(uid){
  const d = (DATA.search_trend||{})[uid]||[];
  if(!d.length) return `<div class="empty small"><b>검색 추이 데이터 없음</b><span>네이버 데이터랩 API(검색어트렌드)가 연결되면 최근 60일 검색 지수가 표시됩니다.</span></div>`;
  const W=640,H=150,L=34,R=8,T=10,B=24, n=d.length;
  const mx = Math.max(10, ...d.map(x=>x.value||0)); const top = Math.ceil(mx/10)*10;
  const x = i => L + i*(W-L-R)/(n-1||1), y = v => T + (1-v/top)*(H-T-B);
  const pts = d.map((p,i)=>`${x(i)},${y(p.value||0)}`).join(" ");
  const last7 = d.slice(-7).reduce((s,p)=>s+(p.value||0),0)/Math.min(7,n), prev7 = d.slice(-14,-7).reduce((s,p)=>s+(p.value||0),0)/Math.max(1,Math.min(7,n-7));
  return `<div class="small">최근 7일 평균 <b class="num">${last7.toFixed(1)}</b> · 직전 7일 <b class="num">${prev7.toFixed(1)}</b> ${prev7>0?`<span class="${last7>=prev7?"delta-up":"delta-dn"}">(${sgn(last7/prev7-1,0)})</span>`:""} <span class="muted">· 지수 100 = 같은 기간 '공모주' 검색량 최고치</span></div>
  <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 60일 검색 지수">
    ${[0,top/2,top].map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join("")}
    <polyline points="${L},${y(0)} ${pts} ${x(n-1)},${y(0)}" fill="var(--brand-soft)" stroke="none"/>
    <polyline points="${pts}" fill="none" stroke="var(--brand-2)" stroke-width="2"/>
    <circle cx="${x(n-1)}" cy="${y(d[n-1].value||0)}" r="4" fill="var(--brand-2)" stroke="var(--surface)" stroke-width="2"/>
    ${d.map((p,i)=>`<rect x="${x(i)-(W-L-R)/n/2}" y="${T}" width="${(W-L-R)/n}" height="${H-T-B}" fill="transparent" data-tip="${md(p.day)}|검색 지수 ${(p.value||0).toFixed(1)}"/>`).join("")}
    ${[0,Math.floor(n/2),n-1].map(i=>`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${md(d[i].day)}</text>`).join("")}</svg>`;
}

    ${body}
    ${R.html()}
    <div class="foot" style="margin-top:16px"><span>공개 자료를 정리한 참고용이며 투자 권유가 아닙니다. 공모주는 원금 손실이 발생할 수 있으며 예금자보호법에 따라 보호되지 않습니다.</span><span>보고서 v${r.version} · ${esc(ago(r.generated_at))} 생성${BRAND?` · ${esc(BRAND.house)} ${esc(BRAND.branch)}`:""}</span></div>`;
}

function render(){
  root.innerHTML = header() + `<main class="gut"><div class="in"><div id="kpibar">${kpis()}</div><div id="banners" style="display:grid;gap:8px"></div><div id="tabbody" style="display:grid;gap:18px"></div>
    <div class="foot"><span>IPO Radar는 공개 자료를 정리한 상담 보조 도구입니다. 관심도는 화제성 지표로 주가 상승 확률이 아니고, 가치평가는 비교기업 기준 상대평가로 투자 권유가 아닙니다.</span>
    <span>데이터 생성 ${esc(DATA.meta.generated_at)} · 예시 데이터는 [예시]로 구분${BRAND?` · ${esc(BRAND.house)} ${esc(BRAND.branch)} 내부 상담용`:""}</span></div></div></main>`;
  renderTab(); renderDetail();
  if(typeof SRV!=="undefined" && SRV.on) renderServerBar();
}
function renderTab(){
  $("#banners").innerHTML = banners();
  const f = {home:todayTab,list:listTab,calendar:calTab,calc:calcTab,compare:compareTab,changes:changesTab,sources:sourcesTab}[S.tab] || todayTab;
  $("#tabbody").innerHTML = f();
  document.querySelectorAll(".nav button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===S.tab));
}
function renderDetail(){
  document.querySelectorAll(".scrim.detail,aside.panel").forEach(e=>e.remove());
  document.body.style.overflow = S.detail ? "hidden" : "";
  if(!S.detail) return;
  const scrim = document.createElement("div"); scrim.className="scrim detail"; scrim.dataset.close="1";
  const p = document.createElement("aside"); p.className="panel"; p.setAttribute("aria-label","종목 상세"); p.innerHTML = detail(S.detail);
  document.body.append(scrim, p); p.querySelector("[data-close]")?.focus();
}
function showNotice(uid){
  const c = byUid[uid]; if(!c) return;
  const box = document.createElement("div"); box.className="scrim"; box.style.cssText="z-index:50;display:grid;place-items:center;padding:16px";
  box.innerHTML = `<div class="card" role="dialog" aria-label="고객 안내문" style="width:min(560px,100%);max-height:90vh;overflow:auto"><div class="ch"><h2>고객 안내문 · ${esc(c.name)}</h2><button class="btn" data-closebox>닫기</button></div>
    <div class="cb"><span class="small muted">문자·메신저에 붙여 넣을 수 있는 글입니다. 보내기 전 최신 공시와 사내 준법감시 기준을 확인하세요.</span>
    <textarea id="notice-text" style="min-height:300px">${esc(notice(c))}</textarea><div class="btns"><button class="btn pri" data-copynotice>복사</button></div></div></div>`;
  document.body.append(box);
  box.addEventListener("click", e=>{ e.stopPropagation(); if(e.target===box || e.target.closest("[data-closebox]")) box.remove(); else if(e.target.closest("[data-copynotice]")){ const ta=$("#notice-text",box); copyText(ta.value, ta); } });
}
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-open],[data-tab],[data-close],[data-watch],[data-cal],[data-calview],[data-notice],[data-dl],[data-print],[data-setprice],[data-week],[data-dtab],[data-calcfor]");
  if(!t || t.disabled) return;
  if(t.dataset.notice){ showNotice(t.dataset.notice); return; }
  if(t.dataset.watch){ const u=t.dataset.watch; S.watch.has(u)?S.watch.delete(u):S.watch.add(u); store.set("watch",[...S.watch]); renderTab(); if(S.detail) renderDetail(); return; }
  if(t.dataset.open){ if(S.detail!==t.dataset.open) S.dtab=t.dataset.goto||"overview"; S.detail=t.dataset.open; renderDetail(); return; }
  if(t.dataset.week){ S.week = t.dataset.week==="0" ? 0 : S.week + Number(t.dataset.week); renderTab(); return; }
  if(t.dataset.dtab){ S.dtab=t.dataset.dtab; const p=document.querySelector("aside.panel"); renderDetail(); const np=document.querySelector("aside.panel"); if(np) np.scrollTop=0; return; }
  if(t.dataset.calcfor){ const c=byUid[t.dataset.calcfor]; S.calc.uid=c.uid; S.calc.price=String(c.price_final ?? (c.price_band?c.price_band.high:"")); S.detail=null; renderDetail(); S.tab="calc"; renderTab(); window.scrollTo(0,0); return; }
  if(t.hasAttribute("data-close")){ S.detail=null; renderDetail(); return; }
  if(t.dataset.tab){ S.tab=t.dataset.tab; store.set("tab",S.tab); S.detail=null; renderDetail(); renderTab(); window.scrollTo(0,0); return; }
  if(t.dataset.cal){ const [y,m]=S.calMonth.split("-").map(Number); const d=new Date(y,m-1+Number(t.dataset.cal),1); S.calMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; renderTab(); return; }
  if(t.dataset.calview){ S.calView=t.dataset.calview; renderTab(); return; }
  if(t.dataset.setprice){ e.preventDefault(); S.calc.price=t.dataset.setprice; renderTab(); return; }
  if(t.hasAttribute("data-print")){ if(FRAMED){ flash("인쇄는 지점 PC에서 연 대시보드 파일에서 사용할 수 있습니다"); return; } window.print(); return; }
  if(t.dataset.dl==="csv") download(`공모주목록_${today}.csv`, csvFor(filtered()), "text/csv;charset=utf-8");
  if(t.dataset.dl==="ics") download(`공모주일정_${today}.ics`, icsFor(calEvents()), "text/calendar;charset=utf-8");
  if(t.dataset.dl==="ics-one") download(`${byUid[t.dataset.uid].name}_일정.ics`, icsFor(DATA.calendar.filter(x=>x.uid===t.dataset.uid)), "text/calendar;charset=utf-8");
});
document.addEventListener("change", e=>{
  const id = e.target.id;
  if(id==="tg-sample"){ S.showSample=e.target.checked; store.set("showSample",S.showSample); renderTab(); return; }
  if(e.target.dataset.sel){ const u=e.target.dataset.sel; e.target.checked?S.sel.add(u):S.sel.delete(u); renderTab(); return; }
  const map = {"f-period":"period","f-kind":"kind","f-sector":"sector","f-stage":"stage","f-verdict":"verdict","f-int":"minInterest"};
  if(map[id]){ S[map[id]] = id==="f-period"?Number(e.target.value):e.target.value; renderTab(); }
  if(id==="f-soon"){ S.soon=e.target.checked; renderTab(); }
  if(id==="f-watch"){ S.onlyWatch=e.target.checked; renderTab(); }
  if(id==="f-house"){ S.onlyHouse=e.target.checked; renderTab(); }
  if(id==="c-uid"){ const c=byUid[e.target.value]; S.calc.uid=e.target.value; S.calc.price = c ? String(c.price_final ?? (c.price_band?c.price_band.high:"")) : ""; if(c&&c.min_subscription) S.calc.minSh=String(c.min_subscription); if(c&&c.deposit_rate!=null) S.calc.rate=String(c.deposit_rate*100); renderTab(); }
});
document.addEventListener("input", e=>{
  const id = e.target.id;
  if(id==="f-q"){ S.q=e.target.value.trim(); const pos=e.target.selectionStart; renderTab(); const q=$("#f-q"); q.focus(); q.setSelectionRange(pos,pos); return; }
  const cm = {"c-price":"price","c-shares":"shares","c-rate":"rate","c-ratio":"ratio","c-min":"minSh"};
  if(cm[id]){ S.calc[cm[id]] = e.target.value; renderTab(); const el=$("#"+id); el.focus(); return; }
  if(id==="memo"){ store.set("memo:"+e.target.dataset.uid, e.target.value); }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && S.detail){ S.detail=null; renderDetail(); } });
document.addEventListener("pointermove", e=>{
  const t = e.target.closest && e.target.closest("[data-tip]");
  if(!t){ tip.hidden=true; return; }
  tip.innerHTML = t.dataset.tip.split("|").map((s,i)=>i?esc(s):`<b>${esc(s)}</b>`).join("<br>");
  tip.hidden=false;
  tip.style.left = Math.min(e.clientX+12, window.innerWidth - tip.offsetWidth - 8)+"px"; tip.style.top = Math.min(e.clientY+12, window.innerHeight - tip.offsetHeight - 8)+"px";
});

/* ---------- 웹 서버 연결 시: 접속자·자동 갱신 알림·관리자 수동 갱신 ---------- */
const SRV = { on:false, role:null, user:null, running:false, newer:false };
async function pollStatus(){
  if(FRAMED || !location.protocol.startsWith("http")) return;
  try{
    const r = await fetch("api/status", {cache:"no-store", credentials:"same-origin"});
    if(!r.ok) return;
    const st = await r.json();
    const hadAccess = !!SRV.access;
    Object.assign(SRV, {on:true, role:st.role, user:st.user, running:!!st.running, next:st.next, access:st.access||null,
      newer: !!(st.generated_at && st.generated_at !== DATA.meta.generated_at && new Date(st.generated_at) > new Date(DATA.meta.generated_at))});
    renderServerBar();
    if(!hadAccess && SRV.access && S.tab==="sources") renderTab();
  }catch(e){}
}
function renderServerBar(){
  let bar = document.getElementById("srvbar");
  if(!bar){ bar = document.createElement("div"); bar.id="srvbar"; const m=document.querySelector("main .in"); if(!m) return; m.prepend(bar); }
  bar.style.cssText="display:grid;gap:8px";
  bar.innerHTML = `${SRV.newer?`<div class="banner" style="border-left-color:var(--good);background:var(--good-soft)"><b>새 데이터가 준비됐습니다</b><span>최신 수집 결과를 보려면 새로고침하세요. <button class="btn pri" onclick="location.reload()">새로고침</button></span></div>`:""}
    ${SRV.running?`<div class="banner" style="border-left-color:var(--brand-2);background:var(--brand-soft)"><b>수집 실행 중</b><span>끝나면 이 화면에 새로고침 안내가 나타납니다.</span></div>`:""}`;
  const meta = document.querySelector(".hmeta");
  if(meta && !document.getElementById("srvuser")){
    const sp = document.createElement("span"); sp.id="srvuser"; meta.prepend(sp);
  }
  const u = document.getElementById("srvuser");
  if(u) u.innerHTML = `${SRV.role==="admin"?`<span class="chip house">관리자 모드</span> <button class="btn" id="btn-refresh" ${SRV.running?"disabled":""}>지금 갱신</button>`:`<span class="chip line">이용자 모드</span>`} <a class="btn" href="/logout">로그아웃</a>`;
}
async function saveUserCode(body){
  const msg = document.getElementById("uc-msg");
  try{
    const r = await fetch("admin/user-code", {method:"POST", credentials:"same-origin",
      headers:{"X-Requested-With":"ipo-radar","Content-Type":"application/json"}, body: JSON.stringify(body)});
    const j = await r.json().catch(()=>({message:"응답을 읽지 못했습니다"}));
    if(j.access) SRV.access = j.access;
    if(r.ok){ renderTab(); const m=document.getElementById("uc-msg"); if(m){ m.style.color="var(--good)"; m.textContent = j.message + (j.sync_message?" · "+j.sync_message:""); } flash(j.message); }
    else if(msg){ msg.style.color="var(--bad)"; msg.textContent = j.message || "변경하지 못했습니다"; }
  }catch(err){ if(msg){ msg.style.color="var(--bad)"; msg.textContent="서버에 연결하지 못했습니다"; } }
}
document.addEventListener("click", e=>{
  if(e.target.id==="uc-save"){ const v=(document.getElementById("uc-code")||{}).value||""; saveUserCode({code:v}); }
  if(e.target.id==="uc-off"){ const m=document.getElementById("uc-msg"); if(e.target.dataset.confirm!=="1"){ e.target.dataset.confirm="1"; e.target.textContent="한 번 더 누르면 이용자 접속을 끕니다"; return; } saveUserCode({disable:true}); }
});
document.addEventListener("change", e=>{ if(e.target.id==="uc-show"){ const i=document.getElementById("uc-code"); if(i) i.type = e.target.checked?"text":"password"; } });
document.addEventListener("click", async e=>{
  if(e.target.id!=="btn-refresh") return;
  e.target.disabled = true;
  try{
    const r = await fetch("admin/refresh", {method:"POST", credentials:"same-origin", headers:{"X-Requested-With":"ipo-radar"}});
    const j = await r.json().catch(()=>({}));
    flash(j.message || (r.ok?"수집을 시작했습니다":"수집을 시작하지 못했습니다"));
    SRV.running = r.status===202 || r.status===409; renderServerBar();
  }catch(err){ flash("서버에 연결하지 못했습니다"); e.target.disabled=false; }
});
render();
pollStatus(); setInterval(pollStatus, 60*1000);
})();
</script>
