<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>매크로 분석</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Roboto+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#f6f4f1; --surface:#ffffff; --surface-2:#f2eeea; --line:#e4ddd5; --line-strong:#cfc4b8;
  --ink:#231815; --ink-2:#5a4c44; --ink-3:#8a7c72;
  --brand:#692c00; --brand-2:#8a4a1c; --brand-soft:#f6ebe1; --gold:#b8873f;
  --good:#1e7a4c; --warn:#a35a00; --bad:#b3261e;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --fear-2:#d95926; --fear-1:#f2a27e; --mid:#d6d2cc; --greed-1:#86b6ef; --greed-2:#256abf;
  --grid:#ece7e1; --axis:#cfc4b8;
  --up:#c8281e; --down:#1f5fbf;
  --f-num:"Roboto Mono",ui-monospace,Consolas,monospace; --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#141110; --surface:#1d1917; --surface-2:#26201d; --line:#352c27; --line-strong:#4a3e37;
  --ink:#f1ebe6; --ink-2:#c9bdb4; --ink-3:#998b81; --brand:#8a4a1c; --brand-2:#c9895a; --brand-soft:#33231a; --gold:#d6a65c;
  --good:#52c08a; --warn:#e5a54d; --bad:#f07f74;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --fear-2:#d95926; --fear-1:#8f4a2c; --mid:#4a423d; --greed-1:#2c5a92; --greed-2:#5598e7;
  --grid:#2c2521; --axis:#4a3e37;
  --up:#ff7b72; --down:#6ea8ff;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141110; --surface:#1d1917; --surface-2:#26201d; --line:#352c27; --line-strong:#4a3e37;
  --ink:#f1ebe6; --ink-2:#c9bdb4; --ink-3:#998b81; --brand:#8a4a1c; --brand-2:#c9895a; --brand-soft:#33231a; --gold:#d6a65c;
  --good:#52c08a; --warn:#e5a54d; --bad:#f07f74;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --fear-2:#d95926; --fear-1:#8f4a2c; --mid:#4a423d; --greed-1:#2c5a92; --greed-2:#5598e7;
  --grid:#2c2521; --axis:#4a3e37;
  --up:#ff7b72; --down:#6ea8ff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:14px;line-height:1.5}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
header{background:var(--surface);border-bottom:1px solid var(--line);border-top:4px solid var(--brand)}
.hin{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap}
.hin .br{font-weight:800}.hin h1{font-size:16px;margin:0;padding-left:12px;border-left:1px solid var(--line)}
.sp{flex:1}
.btn{font:inherit;font-size:13px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:4px;padding:6px 10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.btn:hover{border-color:var(--brand-2)}.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.chip{font-size:12px;border:1px solid var(--line-strong);border-radius:999px;padding:2px 9px;color:var(--ink-2);white-space:nowrap}
.chip.adm{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip.ok{border-color:var(--good);color:var(--good)}.chip.warn{border-color:var(--warn);color:var(--warn)}.chip.bad{border-color:var(--bad);color:var(--bad)}
main{max-width:1200px;margin:0 auto;padding:16px;display:grid;gap:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:4px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:var(--surface);color:var(--ink-2);padding:6px 12px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}.seg button[aria-pressed="true"]{background:var(--brand);color:#fff;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,140px),1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px;align-content:start}
.kpi .lab{font-size:12px;color:var(--ink-2);font-weight:500}
.kpi .val{font-family:var(--f-num);font-size:24px;font-weight:600;line-height:1.2}
.kpi .val small{font-size:13px;font-weight:500;color:var(--ink-2);margin-left:2px}
.kpi .det{font-size:12px;color:var(--ink-2)}
.banner{border:1px solid var(--line);border-left:4px solid var(--gold);background:var(--surface);border-radius:var(--r);padding:10px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.ch{display:flex;gap:8px 12px;align-items:baseline;flex-wrap:wrap;padding:14px 16px 0}
.ch h2{font-size:16px;margin:0}.muted{color:var(--ink-2)}.small{font-size:12.5px}
.cb{padding:12px 16px 16px;display:grid;gap:14px}
.cb>*,.g2>*{min-width:0}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px}
.panel{display:grid;gap:6px;min-width:0;align-content:start}
.panel h3{font-size:13.5px;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
svg.chart{width:100%;height:auto;display:block;overflow:visible;touch-action:pan-y}
svg.chart text{font-size:11px;fill:var(--ink-3);font-family:var(--f-num)}
svg.chart text.dl{fill:var(--ink-2);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:11px}
svg.chart .grid{stroke:var(--grid);stroke-width:1}
svg.chart .axis{stroke:var(--axis);stroke-width:1}
svg.chart .xh{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3}
.empty{border:1px dashed var(--line-strong);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--ink-2);display:grid;gap:4px;font-size:13px}
.empty b{color:var(--ink)}
.note{font-size:12.5px;color:var(--ink-2);margin:0;line-height:1.6;overflow-wrap:anywhere}
details summary{cursor:pointer;font-size:12.5px;color:var(--ink-2)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--ink-2);background:var(--surface-2);white-space:nowrap}
td.r,th.r{text-align:right}
.tw{overflow-x:auto}
.gauge{display:grid;gap:6px}
.track{position:relative;height:14px;display:grid;grid-template-columns:25fr 20fr 10fr 20fr 25fr;gap:2px}
.track span{border-radius:3px}
.track .mk{position:absolute;top:-5px;width:4px;height:24px;background:var(--ink);border-radius:2px;transform:translateX(-2px);box-shadow:0 0 0 2px var(--surface)}
.scale{display:grid;grid-template-columns:25fr 20fr 10fr 20fr 25fr;font-size:11px;color:var(--ink-3);text-align:center}
.big{font-family:var(--f-num);font-size:34px;font-weight:600;line-height:1}
textarea{width:100%;min-height:150px;font-family:var(--f-num);font-size:13px;border:1px solid var(--line-strong);border-radius:4px;padding:8px;background:var(--surface);color:var(--ink)}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;border-radius:4px;padding:6px 9px;max-width:280px;line-height:1.5}
#tip i{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:var(--surface);padding:6px;z-index:30}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--line);scrollbar-width:thin}
.tabs button{font:inherit;font-size:14px;font-weight:500;white-space:nowrap;border:0;background:none;color:var(--ink-2);padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand);font-weight:700}
.tabs button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
select.per{font:inherit;font-size:12.5px;border:1px solid var(--line-strong);border-radius:4px;padding:4px 8px;background:var(--surface);color:var(--ink);cursor:pointer}
button.kpi{font:inherit;text-align:left;color:inherit;cursor:pointer}
button.kpi:hover{border-color:var(--brand-2)}button.kpi:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.sub{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.sub:first-child{border-top:0;padding-top:0}.sub h3{font-size:14.5px;margin:0}
.keybox{display:grid;gap:6px;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:var(--r);padding:12px 14px}
.keyrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.keyrow input{flex:1;min-width:200px;font:inherit;font-family:var(--f-num);padding:8px 10px;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);color:var(--ink)}
.keyrow input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
a{color:var(--brand-2)}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--ink-2)}
.ud{font-size:12px;color:var(--ink-2);display:flex;gap:12px;flex-wrap:wrap}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.mhead b{font-size:17px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.checks li{display:flex;gap:8px;align-items:baseline;font-size:13.5px;border-left:3px solid var(--line-strong);padding:4px 10px;background:var(--surface-2);border-radius:0 4px 4px 0}
.checks li.warn{border-left-color:var(--warn)}.checks li.bad{border-left-color:var(--bad)}.checks li.info{border-left-color:var(--s1)}
.lst{list-style:none;margin:0;padding:0;display:grid;gap:0}
.lst li{display:grid;grid-template-columns:132px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.lst li .d{font-family:var(--f-num);font-size:12.5px;color:var(--ink-2)}
.todo{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.todo label{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.todo input{margin-top:3px;width:16px;height:16px;accent-color:var(--brand)}
.linkbtn{font:inherit;border:0;background:none;padding:0;color:var(--ink);cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
.linkbtn:hover{color:var(--brand-2)}
@media (max-width:640px){.lst li{grid-template-columns:1fr;gap:2px}.hin h1{border-left:0;padding-left:0;width:100%}.kpi .val{font-size:20px}}
@media print{header .btn,.seg,#tip{display:none}}
</style>
</head>
<body>
<a class="skip" href="#main">본문으로</a>
<header><div class="hin" id="hdr"></div></header>
<main id="main"><div class="empty"><b>매크로 지표를 불러오는 중입니다</b></div></main>
<div id="tip" hidden></div>
<script>
"use strict";
const BOOT = /*__MACRO_BOOT__*/null || {role:"admin", branch:"", logo:"<b>IPO Radar</b>"};
const ADMIN = BOOT.role === "admin";
const store = { get(k,d){ try{ const v=localStorage.getItem("macro:"+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
                set(k,v){ try{ localStorage.setItem("macro:"+k, JSON.stringify(v)); }catch(e){} } };
const PERIODS = [["1m","최근 1개월",31],["3m","최근 3개월",92],["6m","최근 6개월",183],["1y","최근 1년",366],["3y","최근 3년",1096],["5y","최근 5년",1827],["10y","최근 10년",3653],["all","전체",null]];
const COLORS = ["var(--s1)","var(--s2)","var(--s3)","var(--s4)"];
const TABS = [["morning","아침 브리핑"],["markets","증시·원자재"],["rates","금리·국채"],["senti","시장 심리"],["credit","신용·CDS"],["semi","반도체·DRAM"],["fx","환율·유가"],["pizza","피자 지수"],["ai","AI 토큰"],["keys", ADMIN?"API 키·자료 관리":"자료 상태"]];
const KEYMSG = {};
const PTS = {};                    // 그래프 점(탭을 열 때 필요한 지표만 받아 둠)
const PER = store.get("per", {});  // 그래프별 기간
let D = null, POLL = null;
let TAB = (location.hash||"").slice(1) || store.get("tab","morning");
if(!TABS.some(x=>x[0]===TAB)) TAB = "morning";
const CHARTS = [];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAY = 86400000;
const t = d => Date.parse(d + "T00:00:00Z");

function dec(unit){ return unit==="원"?1 : unit==="0~100"||unit==="bp"?0 : unit==="지수"?1 : 2; }
function fmt(v, unit, d){ if(v==null||!isFinite(v)) return "–"; if(Math.abs(v)<1e-9) v = 0; const k = d ?? dec(unit); return Number(v).toLocaleString("ko-KR",{minimumFractionDigits:k, maximumFractionDigits:k}); }
function sgn(v, k=2){ if(v==null||!isFinite(v)) return "–"; if(Math.abs(v)<1e-9) v = 0; const s = Number(v).toLocaleString("ko-KR",{minimumFractionDigits:k,maximumFractionDigits:k}); return v>0?"+"+s : v<0? s.replace("-","−") : s; }
function kst(isoStr){ if(!isoStr) return "–"; const d=new Date(isoStr); if(isNaN(d)) return esc(isoStr); return d.toLocaleString("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}); }
/* 증감: 국내 관례대로 상승 빨강 ▲, 하락 파랑 ▼ (색만으로 구분하지 않게 화살표 함께) */
function chg(delta, k=2, suffix=""){
  if(delta==null || !isFinite(delta)) return `<span class="flat">–</span>`;
  const r = Math.round(delta*Math.pow(10,k))/Math.pow(10,k);
  if(r===0) return `<span class="flat">0${suffix}</span>`;
  const txt = Math.abs(r).toLocaleString("ko-KR",{minimumFractionDigits:k,maximumFractionDigits:k});
  return r>0 ? `<span class="up">▲ ${txt}${suffix}</span>` : `<span class="down">▼ ${txt}${suffix}</span>`;
}
function todayKST(){ return new Date().toLocaleDateString("sv-SE",{timeZone:"Asia/Seoul"}); }
const DOW = ["일","월","화","수","목","금","토"];
function dayLabel(d){ const x = new Date(d+"T00:00:00Z"); return `${d.slice(5).replace("-","/")}(${DOW[x.getUTCDay()]})`; }
function shortDate(d){ return d && d.slice(0,4)===String(new Date().getFullYear()) ? d.slice(5).replace("-","/") : d; }
function valueAt(points, targetMs){ let best=null; for(const p of points){ if(t(p[0])<=targetMs) best=p; else break; } return best; }

function S(id){
  if(id==="_sentiment") return D.sentiment && D.sentiment.available ? {id, name:"시장 심리 지수", unit:"0~100", source:"derived", years:D.sentiment.years||[], last:[D.sentiment.date, D.sentiment.value]} : {id, name:"시장 심리 지수", unit:"0~100", source:"derived", years:[], last:null};
  return D && D.series[id];
}
const GROUP_PREFIX = {sentiment:"fng"};
const AUTO_SRC = {dram:"dramx", pizza:"pizzint"};
const SRC_LABEL = {manual:"관리자 입력", dramx:"DRAMeXchange 자동", pizzint:"PizzINT 자동", yahoo:"Yahoo", cnn:"CNN"};
function manualIds(group){ return Object.values(D.series).filter(s=>s.group===group && s.dynamic && s.count).sort((a,b)=>a.name.localeCompare(b.name,"ko")).map(s=>s.id); }
function needIds(tab){
  return ({markets:MARKET_PANELS.map(x=>x[1]),
    rates:["us.2y","us.10y","us.30y","kr.base","kr.3y","kr.10y","kr.30y","us.10y2y","us.ffr"],
    senti:["_sentiment","fng.crypto","risk.vix","eq.sp500",...manualIds("sentiment").slice(0,4)],
    credit:[...manualIds("cds").slice(0,4),"credit.hy","credit.ig"],
    semi:[...manualIds("dram").slice(0,4),"semi.ppi"],
    fx:["fx.usdkrw","fx.dxy_broad","cmd.wti",...manualIds("custom").slice(0,4)],
    pizza:manualIds("pizza").slice(0,4)})[tab] || [];
}
async function ensurePoints(ids){
  const miss = ids.filter(i=>!(i in PTS));
  for(let i=0;i<miss.length;i+=20){
    const part = miss.slice(i,i+20);
    const r = await fetch("/api/macro/points?ids="+encodeURIComponent(part.join(",")), {cache:"no-store", credentials:"same-origin"});
    if(r.status===401){ location.href="/login"; return; }
    if(!r.ok) throw new Error("그래프 자료를 받지 못했습니다(HTTP "+r.status+")");
    Object.assign(PTS, await r.json());
  }
}

// ---------- 기간 ----------
function periodSelect(key, years, def){
  const cur = PER[key] || def || "1y";
  const opts = PERIODS.map(p=>`<option value="${p[0]}" ${p[0]===cur?"selected":""}>${p[1]}</option>`).join("")
    + (years.length?`<optgroup label="연도별">${years.map(y=>`<option value="y${y}" ${("y"+y)===cur?"selected":""}>${y}년</option>`).join("")}</optgroup>`:"");
  return `<select class="per" data-per="${esc(key)}" aria-label="그래프 기간">${opts}</select>`;
}
function applyPeriod(points, per, endMs){
  if(!points || !points.length || per==="all") return points || [];
  if(per.startsWith("y")){ const y = per.slice(1); return points.filter(p=>p[0].startsWith(y)); }
  const days = (PERIODS.find(p=>p[0]===per)||PERIODS[3])[2];
  return points.filter(p=>t(p[0]) >= endMs - days*DAY);
}

// ---------- 차트 ----------
function niceTicks(lo, hi, n=4){
  if(lo===hi){ lo -= 1; hi += 1; }
  const span = hi-lo, raw = span/n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(m=>m*mag).find(s => span/s <= n) || 10*mag;
  const a = Math.floor(lo/step)*step, b = Math.ceil(hi/step)*step, out=[];
  for(let v=a; v<=b+step/2; v+=step) out.push(+v.toFixed(10));
  return out;
}
function dateLabel(ms, spanDays){ const d=new Date(ms); const y=d.getUTCFullYear(), m=d.getUTCMonth()+1, dd=d.getUTCDate();
  return spanDays > 400 ? `${y}.${String(m).padStart(2,"0")}` : spanDays > 60 ? `${String(y).slice(2)}.${String(m).padStart(2,"0")}` : `${m}/${dd}`; }

/* defs: [{name, points:[[date,v]], unit}] — 같은 단위만 한 차트에 그린다(이중 축 금지) */
function lineChart(defs, opts={}){
  defs = defs.filter(d => d.points && d.points.length);
  if(!defs.length) return "";
  const W=opts.wide?1100:640, H=opts.h||(opts.wide?260:220), L=48, T=10, B=24, labels = defs.length<=4 && opts.direct!==false, R = labels?(defs.length===1?56:100):14;
  const all = defs.flatMap(d=>d.points);
  const xs = all.map(p=>t(p[0])), x0=Math.min(...xs), x1=Math.max(...xs, x0+DAY);
  let lo=Math.min(...all.map(p=>p[1])), hi=Math.max(...all.map(p=>p[1]));
  if(opts.zero){ lo=Math.min(lo,0); hi=Math.max(hi,0); }
  const fixedOk = opts.fixed && lo>=opts.fixed[0] && hi<=opts.fixed[1];
  if(fixedOk){ lo=opts.fixed[0]; hi=opts.fixed[1]; }
  const ticks = fixedOk ? opts.ticks : niceTicks(lo, hi); const y0=ticks[0], y1=ticks[ticks.length-1];
  const X = ms => L + (ms-x0)/(x1-x0)*(W-L-R), Y = v => T + (1-(v-y0)/(y1-y0||1))*(H-T-B);
  const span = (x1-x0)/DAY, nx = 5, xt = Array.from({length:nx}, (_,i)=> x0 + (x1-x0)*i/(nx-1));
  const unit = defs[0].unit, k = opts.dec ?? dec(unit);
  const paths = defs.map((d,i)=>{
    const col = d.color || COLORS[i%4];
    const dpath = d.points.map((p,j)=>`${j?"L":"M"}${X(t(p[0])).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
    return `<path d="${dpath}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }).join("");
  // 선 끝 직접 표기(겹치면 위아래로 벌림)
  let dl = "";
  if(labels){
    const ends = defs.map((d,i)=>{ const p=d.points[d.points.length-1]; const nm = defs.length===1 ? "" : (d.short||d.name); return {i, y:Y(p[1]), x:X(t(p[0])), v:p[1], name: nm.length>9 ? nm.slice(0,8)+"…" : nm, col:d.color||COLORS[i%4]}; }).sort((a,b)=>a.y-b.y);
    for(let j=1;j<ends.length;j++) if(ends[j].y-ends[j-1].y<14) ends[j].y = ends[j-1].y+14;
    dl = ends.map(e=>`<circle cx="${e.x.toFixed(1)}" cy="${Y(defs[e.i].points[defs[e.i].points.length-1][1]).toFixed(1)}" r="4" fill="${e.col}" stroke="var(--surface)" stroke-width="2"/>
      <text class="dl" x="${(e.x+8).toFixed(1)}" y="${(e.y+4).toFixed(1)}">${esc(e.name)}${e.name?" ":""}${fmt(e.v,unit,k)}</text>`).join("");
  }
  const id = CHARTS.length;
  const dates = [...new Set(all.map(p=>p[0]))].sort();
  CHARTS.push({id, defs, X, Y, L, R, W, H, T, B, dates, unit, k, x0, x1});
  const legend = defs.length>=2 ? `<div class="legend">${defs.map((d,i)=>`<span><i style="background:${d.color||COLORS[i%4]}"></i>${esc(d.name)}</span>`).join("")}</div>` : "";
  const aria = `${defs.map(d=>d.name).join(", ")} 추이 그래프`;
  const tbl = `<details><summary>최근 값 표로 보기</summary><div class="tw"><table><thead><tr><th>날짜</th>${defs.map(d=>`<th class="r">${esc(d.short||d.name)}</th>`).join("")}</tr></thead><tbody>${
    dates.slice(-10).reverse().map(dt=>`<tr><td class="num">${dt}</td>${defs.map(d=>{ const p=d.points.find(q=>q[0]===dt); return `<td class="r num">${p?fmt(p[1],unit,k):"–"}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div></details>`;
  return `${legend}<svg class="chart" data-chart="${id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">
    ${ticks.map(v=>`<line class="${v===0&&opts.zero?"axis":"grid"}" x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text x="${L-6}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${fmt(v,unit,Math.min(k, Math.abs(ticks[1]-ticks[0])<1?2:0))}</text>`).join("")}
    ${opts.bands||""}
    <line class="axis" x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/>
    ${xt.map((v,i)=>`<text x="${X(v).toFixed(1)}" y="${H-6}" text-anchor="${i===0?"start":i===nx-1?"end":"middle"}">${dateLabel(v,span)}</text>`).join("")}
    ${paths}${dl}
    <line class="xh" x1="0" x2="0" y1="${T}" y2="${H-B}" visibility="hidden"/>
    <rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent"/>
  </svg>${opts.table===false?"":tbl}`;
}

function barChart(rows){
  if(!rows.length) return "";
  const W=1100,H=240,L=56,R=14,T=10,B=24;
  const max = Math.max(...rows.map(r=>r.input+r.output), 1), ticks = niceTicks(0, max), top = ticks[ticks.length-1];
  const bw = Math.max(2, (W-L-R)/rows.length - 2);
  const X = i => L + i*((W-L-R)/rows.length) + 1, Y = v => T + (1 - v/top)*(H-T-B);
  const bars = rows.map((r,i)=>{
    const yi = Y(r.input), yo = Y(r.input + r.output);
    const tip = `${r.date}|입력 ${r.input.toLocaleString()} 토큰|출력 ${r.output.toLocaleString()} 토큰|호출 ${r.calls}회${r.cost_usd!=null?`|비용 $${r.cost_usd}`:""}`;
    return `<g data-tip="${esc(tip)}"><rect x="${X(i)}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent"/>
      <rect x="${X(i)}" y="${yi}" width="${bw}" height="${Math.max(0,H-B-yi)}" fill="var(--s1)" rx="2"/>
      ${r.output?`<rect x="${X(i)}" y="${yo}" width="${bw}" height="${Math.max(0,yi-yo-2)}" fill="var(--s2)" rx="2"/>`:""}</g>`;
  }).join("");
  const step = Math.ceil(rows.length/6);
  return `<div class="legend"><span><i style="background:var(--s1)"></i>입력 토큰</span><span><i style="background:var(--s2)"></i>출력 토큰(생각 토큰 포함)</span></div>
  <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="일별 AI 토큰 사용량 막대 그래프">
    ${ticks.map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v>=1e6?(v/1e6).toFixed(1)+"M":v>=1e3?(v/1e3).toFixed(0)+"K":v}</text>`).join("")}
    <line class="axis" x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/>
    ${rows.map((r,i)=> i%step===0 ? `<text x="${X(i)+bw/2}" y="${H-6}" text-anchor="middle">${r.date.slice(5).replace("-","/")}</text>` : "").join("")}
    ${bars}</svg>`;
}

function needWhy(source){
  const st = D.status[source] || {};
  if(source==="manual") return "무료 공개 API가 없는 자료라 관리자가 값을 입력하면 그래프로 표시됩니다.";
  if(source==="derived") return esc((D.sentiment&&D.sentiment.reason)||"구성 자료가 부족합니다.");
  if(["cnn","dramx","pizzint"].includes(source) && st.status && st.status!=="ok") return `${esc(st.name||source)}에서 받지 못했습니다${ADMIN&&st.message?` — ${esc(st.message)}`:""}. 사이트가 막거나 화면 형식이 바뀐 경우입니다.`;
  if(source==="yahoo" && st.status!=="ok" && st.status!=="partial") return ADMIN ? `Yahoo Finance 연결이 꺼져 있거나 막혀 있습니다. <button class="linkbtn" data-goto="keys">API 키·자료 관리</button> 탭에서 켤 수 있습니다(비공식 경로).` : "Yahoo Finance 연결이 꺼져 있습니다(관리자 설정).";
  if(st.status==="not_configured") return ADMIN ? `<a href="#keys" data-goto="keys">API 키·자료 관리</a> 탭에서 ${esc(st.key)}를 등록하면 자동 수집됩니다.` : "관리자가 API 키를 등록하면 자동 수집됩니다.";
  if(st.status==="never") return "아직 수집하지 않았습니다. 첫 수집이 끝나면 표시됩니다.";
  return "자료를 받지 못했습니다" + (ADMIN && st.message ? ` — ${esc(st.message)}` : "") + ".";
}

function panel(key, title, ids, opts={}){
  const metas = ids.map(S).filter(Boolean);
  const years = [...new Set(metas.flatMap(m=>m.years||[]))].sort().reverse();
  const per = PER[key] || opts.def || "1y";
  const loaded = metas.filter(m=>m.last).every(m=>m.id in PTS);
  const all = metas.map(m=>PTS[m.id]||[]);
  const endMs = Math.max(0, ...all.filter(p=>p.length).map(p=>t(p[p.length-1][0])));
  const defs = metas.map((m,i)=>({name:m.name, short:opts.short?opts.short[i]:null, unit:m.unit, points:applyPeriod(all[i], per, endMs)}));
  const hasAny = metas.some(m=>m.last);
  const unit = metas[0] ? metas[0].unit : "";
  const lastDate = metas.map(m=>m.last?m.last[0]:null).filter(Boolean).sort().pop();
  let body;
  if(!hasAny) body = empty("자료 없음", needWhy(metas[0]?metas[0].source:"fred"));
  else if(!loaded) body = `<div class="empty"><span>그래프 불러오는 중…</span></div>`;
  else if(!defs.some(d=>d.points.length)) body = empty("선택한 기간에 값이 없습니다", "다른 기간이나 연도를 골라 보세요.");
  else body = lineChart(defs, opts);
  return `<div class="panel"><div class="ph"><h3>${esc(title)} <span class="muted small">${esc(unit)}${lastDate?` · 최근 ${lastDate}`:""}</span></h3>${hasAny?periodSelect(key, years, opts.def):""}</div>
    ${body}${opts.note?`<p class="note">${opts.note}</p>`:""}</div>`;
}

const KEY_HELP = {DATA_GO_KR_KEY:["공공데이터포털(금융위원회 지수시세)","https://www.data.go.kr/data/15094807/openapi.do","data.go.kr → 금융위원회_지수시세정보 활용신청(무료)","코스피·코스닥 지수(2020년 이후, 영업일 하루 늦게 반영). 일반 인증키(Decoding)·(Encoding) 둘 다 됩니다"],
ECOS_API_KEY:["한국은행 ECOS","https://ecos.bok.or.kr/api/","ecos.bok.or.kr/api → 인증키 신청(무료)","한국 기준금리·국고채 3/10/30년·원/달러. 키가 없으면 공개 샘플 키로 최근 값만 받습니다"],
                  FRED_API_KEY:["FRED(미국 세인트루이스 연준)","https://fredaccount.stlouisfed.org/apikeys","fredaccount.stlouisfed.org → API Keys(무료)","미국 금리·국채·회사채 스프레드·VIX·S&P 500·달러·유가. 키가 없어도 공개 CSV로 받고, 키를 등록하면 경제지표 발표 일정까지 받습니다"]};
function keyCard(){
  const ks = D.keys||[];
  const src = {dashboard:"이 화면에서 등록", env:"서버 환경변수"};
  return `<section class="sub" id="keys-card"><h3>API 키 등록</h3>
    ${ks.map(k=>{ const h = KEY_HELP[k.name]||[k.name,"","",""]; const st = D.status[KEY_SRC[k.name]]||{}; const [lab,cls] = STATUS[st.status]||["",""];
      return `<div class="keybox">
        <div><b>${esc(h[0])}</b> <span class="muted small num">${esc(k.name)}</span></div>
        <div class="small">${k.set?`<span class="chip ok">등록됨 ····${esc(k.tail)}</span> ${src[k.source]||""}${k.updated_at?` · ${kst(k.updated_at)}`:""}`:`<span class="chip warn">미등록</span>`} ${lab?` · 수집 상태 <span class="chip ${cls}">${lab}</span>`:""}</div>
        <div class="small muted">받는 자료: ${esc(h[3])} · 발급: <a href="${h[1]}" target="_blank" rel="noopener noreferrer">${esc(h[2])}</a></div>
        <div class="keyrow"><input type="password" id="key-${k.name}" autocomplete="off" spellcheck="false" placeholder="${k.set?"새 키로 바꾸려면 붙여 넣기":"발급받은 키 붙여 넣기"}" aria-label="${esc(h[0])} API 키">
          <button class="btn pri" data-keysave="${k.name}">등록 후 수집</button>${k.source==="dashboard"?`<button class="btn" data-keyclear="${k.name}">삭제</button>`:""}</div>
        <span class="small" id="msg-${k.name}" role="status" style="color:${KEYMSG[k.name]?KEYMSG[k.name][0]:"inherit"}">${esc(KEYMSG[k.name]?KEYMSG[k.name][1]:"")}</span></div>`; }).join("")}
    ${yahooBox()}
    <p class="note">키는 서버 파일에만 저장되고 화면·이용자에게 보내지 않습니다(끝 4자리만 표시). Render 무료 플랜은 재배포·재시작 때 서버 파일이 지워질 수 있어, RENDER_API_KEY·RENDER_SERVICE_ID가 설정돼 있으면 Render 환경변수에도 함께 저장합니다. 키를 채팅·메신저에 붙여 넣지 마세요.</p></section>`;
}
function statusCard(){
  const rows = Object.values(D.status).map(s=>{ const [lab,cls] = STATUS[s.status]||[s.status,""];
    return `<tr><td>${esc(s.name)}${s.url?` <a class="small muted" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">출처</a>`:""}</td><td><span class="chip ${cls}">${lab}</span></td><td class="num" style="white-space:nowrap">${kst(s.checked_at)}</td>${ADMIN?`<td class="small">${esc(s.message||"")}</td>`:""}</tr>`; }).join("");
  return `<section class="sub"><h3>자료원 상태</h3><div class="tw"><table><thead><tr><th>자료원</th><th>상태</th><th>마지막 확인</th>${ADMIN?"<th>내용</th>":""}</tr></thead><tbody>${rows}</tbody></table></div>
    <p class="note">FRED 자료: Federal Reserve Bank of St. Louis(원 출처는 미 재무부·연준·ICE·CBOE·S&P·노동통계국 등). 한국 자료: 한국은행 경제통계시스템(ECOS). 자동 갱신 ${(D.refresh||{}).every_hours||6}시간마다. 투자 권유가 아닌 참고 자료입니다.</p></section>`;
}
function manualCard(){
  const manual = Object.values(D.series).filter(s=>s.source==="manual" && s.count);
  const help = Object.entries(D.manual_help||{}).map(([k,v])=>`<li><b>${k}.</b> ${esc(v)}</li>`).join("");
  return `<section class="sub"><h3>관리자 입력 (CDS·DRAM·피자 지수 등)</h3>
    <p class="note">한 줄에 <b class="num">시리즈,날짜(YYYY-MM-DD),값</b>을 쉼표로 적습니다. 같은 시리즈·날짜를 다시 넣으면 덮어씁니다. 원본에 없는 값은 넣지 마세요.</p>
    <ul class="note" style="margin:0;padding-left:18px">${help}</ul>
    <textarea id="mi-text" aria-label="관리자 입력 자료" placeholder="cds.삼성전자 5Y,2026-10-29,32&#10;dram.DDR5 16Gb 현물,2026-10-29,6.10&#10;pizza.지수,2026-10-29,3"></textarea>
    <div class="keyrow"><button class="btn pri" id="mi-save">저장</button><span id="mi-msg" class="small" role="status"></span></div>
    ${manual.length?`<div class="tw"><table><thead><tr><th>입력된 시리즈</th><th class="r">값 개수</th><th>최근</th><th></th></tr></thead><tbody>${manual.map(s=>`<tr><td class="num">${esc(s.id)}</td><td class="r num">${s.count}</td><td class="num">${s.last[0]} · ${fmt(s.last[1],"",2)}</td><td><button class="btn" data-del="${esc(s.id)}">삭제</button></td></tr>`).join("")}</tbody></table></div>`:""}</section>`;
}
function tabKeys(){
  if(!ADMIN) return `<div class="banner"><span>API 키 등록과 관리자 입력은 <b>관리자 모드</b>로 접속하면 이 탭에서 할 수 있습니다.</span></div>${statusCard()}`;
  return `${keyCard()}${statusCard()}${manualCard()}
    <div class="keyrow"><button class="btn" id="btn-refresh2">지금 다시 수집</button><span class="small muted">${(D.refresh||{}).running?"수집 중…":""}</span></div>`;
}
const TAB_FN = {morning:tabMorning, markets:tabMarkets, rates:tabRates, senti:tabSenti, credit:tabCredit, semi:tabSemi, fx:tabFx, pizza:tabPizza, ai:tabAI, keys:tabKeys};
const TAB_SRC = {morning:"FRED · 한국은행 ECOS · 공공데이터포털 · Yahoo Finance · CNN · IPO Radar", markets:"공공데이터포털·Yahoo Finance", rates:"FRED · 한국은행 ECOS", senti:"자체 산출 · CNN · alternative.me · FRED", credit:"관리자 입력 · FRED(ICE BofA)", semi:"DRAMeXchange 자동 · FRED · 관리자 입력", fx:"한국은행 ECOS · FRED", pizza:"PizzINT 자동 · 관리자 입력", ai:"이 서비스의 AI 요약 호출 기록", keys:"관리자만 키 등록·입력 가능"};

// ---------- 화면 ----------
function header(){
  $("#hdr").innerHTML = `${BOOT.logo}<span class="br">${BOOT.branch}</span><h1>매크로 분석</h1><span class="sp"></span>
    ${ADMIN?`<span class="chip adm">관리자 모드</span>`:`<span class="chip">이용자 모드</span>`}
    <button class="btn" id="btn-reload" title="최신 자료로 다시 불러옵니다. 자료가 30분 넘게 지났으면 새로 수집합니다.">⟳ 새로고침</button>
    ${ADMIN?`<button class="btn" id="btn-refresh" title="수집 간격과 관계없이 지금 바로 다시 수집">지금 갱신</button>`:""}
    <a class="btn" href="/">← 메뉴</a><a class="btn" href="/ipo">IPO Radar</a><a class="btn" href="/logout">로그아웃</a>`;
}
function render(){
  const fresh = D.refresh || {};
  $("#main").innerHTML = `<nav class="tabs" role="tablist" aria-label="매크로 메뉴">${TABS.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${k===TAB}">${l}</button>`).join("")}</nav>
    <div class="bar"><span>화면 생성 ${kst(D.generated_at)}</span><span>자동 갱신 ${fresh.every_hours||6}시간마다</span>${fresh.running?`<span class="chip warn">수집 중…</span>`:""}</div>
    <section class="card" id="tc"></section>`;
  renderTab();
}
let RENDER_SEQ = 0;
async function renderTab(){
  const seq = ++RENDER_SEQ;
  const draw = () => {
    CHARTS.length = 0;
    const title = (TABS.find(x=>x[0]===TAB)||TABS[0])[1];
    $("#tc").innerHTML = `<div class="ch"><h2>${esc(title)}</h2>${TAB_SRC[TAB]?`<span class="muted small">${TAB_SRC[TAB]}</span>`:""}</div><div class="cb">${TAB_FN[TAB]()}</div>`;
  };
  draw();  // 먼저 요약으로 그리고(그래프 자리는 '불러오는 중')
  const ids = needIds(TAB).filter(i=>{ const s=S(i); return s && s.last; });
  if(ids.some(i=>!(i in PTS))){
    try{ await ensurePoints(ids); }
    catch(err){ if(seq===RENDER_SEQ) flash(err.message); return; }
    if(seq===RENDER_SEQ) draw();
  }
}
function setTab(k){
  if(!TAB_FN[k]) return;
  TAB = k; store.set("tab", k);
  try{ history.replaceState(null, "", "#"+k); }catch(e){}
  document.querySelectorAll(".tabs [data-tab]").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.tab===k)));
  renderTab();
  window.scrollTo({top:0});
}

// ---------- 상호작용 ----------
const tip = $("#tip");
function showTip(html, e){ tip.innerHTML = html; tip.hidden = false;
  tip.style.left = Math.min(e.clientX+14, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = Math.min(e.clientY+14, innerHeight - tip.offsetHeight - 8) + "px"; }
document.addEventListener("pointermove", e=>{
  const g = e.target.closest && e.target.closest("[data-tip]");
  if(g){ showTip(g.dataset.tip.split("|").map((s,i)=>i?esc(s):`<b>${esc(s)}</b>`).join("<br>"), e); return; }
  const svg = e.target.closest && e.target.closest("svg[data-chart]");
  document.querySelectorAll("svg[data-chart] .xh").forEach(l=>{ if(!svg || l.ownerSVGElement!==svg) l.setAttribute("visibility","hidden"); });
  if(!svg){ tip.hidden = true; return; }
  const c = CHARTS[+svg.dataset.chart]; if(!c) return;
  const r = svg.getBoundingClientRect(), vx = (e.clientX - r.left) / r.width * c.W;
  if(vx < c.L || vx > c.W - c.R){ tip.hidden = true; svg.querySelector(".xh").setAttribute("visibility","hidden"); return; }
  const ms = c.x0 + (vx - c.L) / (c.W - c.L - c.R) * (c.x1 - c.x0);
  let best = c.dates[0], bd = Infinity; for(const d of c.dates){ const k = Math.abs(t(d)-ms); if(k<bd){ bd=k; best=d; } }
  const xh = svg.querySelector(".xh"); const px = c.X(t(best)); xh.setAttribute("x1",px); xh.setAttribute("x2",px); xh.setAttribute("visibility","visible");
  const lines = c.defs.map((d,i)=>{ const p = valueAt(d.points, t(best)); return p ? `<i style="background:${d.color||COLORS[i%4]}"></i>${esc(d.short||d.name)} <b>${fmt(p[1],c.unit,c.k)}</b>${p[0]!==best?` <span style="opacity:.7">(${p[0]})</span>`:""}` : null; }).filter(Boolean);
  showTip(`<b>${best}</b><br>${lines.join("<br>")}`, e);
});
document.addEventListener("pointerleave", ()=>{ tip.hidden = true; });
document.addEventListener("change", e=>{
  if(e.target.dataset && e.target.dataset.todo!=null){ const key="todo:"+todayKST(), st=store.get(key,{}); st[e.target.dataset.todo]=e.target.checked; store.set(key, st); return; }
  const sel = e.target.closest("select[data-per]"); if(!sel) return;
  PER[sel.dataset.per] = sel.value; store.set("per", PER);
  const y = scrollY; renderTab().then(()=>scrollTo(0,y)); scrollTo(0,y);
});
document.addEventListener("keydown", e=>{  // 탭 목록: 좌우 화살표로 이동
  const b = e.target.closest && e.target.closest(".tabs [data-tab]"); if(!b) return;
  if(e.key!=="ArrowRight" && e.key!=="ArrowLeft") return;
  const i = TABS.findIndex(x=>x[0]===b.dataset.tab), n = TABS[(i + (e.key==="ArrowRight"?1:-1) + TABS.length) % TABS.length][0];
  setTab(n); const nb = document.querySelector(`.tabs [data-tab="${n}"]`); if(nb) nb.focus(); e.preventDefault();
});
document.addEventListener("click", async e=>{
  const go = e.target.closest("[data-goto]");
  if(go){ e.preventDefault(); setTab(go.dataset.goto); return; }
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.tab){ setTab(b.dataset.tab); return; }
  if(b.id==="copy-brief"){ const txt = briefText();
    try{ await navigator.clipboard.writeText(txt); flash("요약을 복사했습니다. 메신저에 붙여 넣기 전에 내용을 한 번 확인하세요."); }
    catch(err){ window.prompt("아래 내용을 복사하세요", txt); }
    return; }
  if(b.id==="btn-reload"){ b.disabled = true;
    const r = await post("/api/macro/refresh"); await load(true); flash(r.message || "최신 자료로 다시 불러왔습니다");
    if(r.started) startPoll(); return; }
  if(b.dataset.yahoo){ const on = b.dataset.yahoo==="on";
    b.disabled = true; const r = await post("/admin/macro-yahoo", {on});
    KEYMSG.yahoo = ["", r.message||""]; await load(true); if(r.refresh_started) startPoll(); return; }
  if(b.id==="btn-refresh" || b.id==="btn-refresh2"){ b.disabled = true;
    const r = await post("/admin/macro-refresh"); flash(r.message || "요청했습니다"); startPoll(); return; }
  if(b.dataset.keysave || b.dataset.keyclear){
    const name = b.dataset.keysave || b.dataset.keyclear, inp = document.getElementById("key-"+name), msg = document.getElementById("msg-"+name);
    let body;
    if(b.dataset.keysave){ const v = (inp.value||"").trim(); if(!v){ msg.style.color="var(--bad)"; msg.textContent="키를 붙여 넣으세요"; return; } body = {name, key:v}; }
    else { if(!confirm("이 화면에서 등록한 키를 삭제할까요?")) return; body = {name, clear:true}; }
    b.disabled = true; const r = await post("/admin/macro-key", body); inp.value = "";
    if(r.ok){ KEYMSG[name] = ["var(--good)", r.message + (r.sync_message?" · "+r.sync_message+".":"") + " 수집 결과는 위 ‘수집 상태’에 표시됩니다(15초마다 갱신)."]; await load(true); if(r.refresh_started) startPoll(); }
    else { b.disabled = false; msg.style.color="var(--bad)"; msg.textContent = r.message || "등록하지 못했습니다"; }
    return; }
  if(b.id==="mi-save"){ const msg = $("#mi-msg"); const text = $("#mi-text").value;
    if(!text.trim()){ msg.textContent = "입력할 내용이 없습니다"; return; }
    const r = await post("/admin/macro-manual", {text});
    if(r.saved){ await load(true); const m=$("#mi-msg"); if(m){ m.style.color="var(--good)"; m.textContent = r.message + (r.errors&&r.errors.length?" — "+r.errors.join(" / "):""); } if(r.errors && r.errors.length){ const ta=$("#mi-text"); if(ta) ta.value = text; } }
    else { msg.style.color="var(--bad)"; msg.textContent = (r.message||"저장하지 못했습니다") + (r.errors&&r.errors.length?" — "+r.errors.join(" / "):""); }
    return; }
  if(b.dataset.del){ if(!confirm(`${b.dataset.del} 시리즈의 관리자 입력 값을 모두 지울까요? 되돌릴 수 없습니다.`)) return;
    const r = await post("/admin/macro-manual", {delete: b.dataset.del}); flash(r.message||"삭제했습니다"); await load(true); }
});
window.addEventListener("hashchange", ()=>{ const k = location.hash.slice(1); if(k && k!==TAB && TAB_FN[k]) setTab(k); });
async function post(url, body){
  try{ const r = await fetch(url, {method:"POST", credentials:"same-origin", headers:{"X-Requested-With":"ipo-radar","Content-Type":"application/json"}, body: JSON.stringify(body||{})});
    return await r.json().catch(()=>({message:`응답 오류 ${r.status}`})); }
  catch(err){ return {message:"서버에 연결하지 못했습니다"}; }
}
function flash(m){ const el = document.createElement("div"); el.className="banner"; el.setAttribute("role","status"); el.textContent = m; $("#main").prepend(el); setTimeout(()=>el.remove(), 5000); }
function startPoll(){ clearInterval(POLL); POLL = setInterval(async ()=>{ await load(true); if(!(D.refresh||{}).running){ clearInterval(POLL); POLL=null; } }, 15000); }
async function load(keep){
  try{
    const r = await fetch("/api/macro", {cache:"no-store", credentials:"same-origin"});
    if(r.status===401){ location.href = "/login"; return; }
    if(!r.ok) throw new Error("HTTP " + r.status);
    const y = scrollY; D = await r.json();
    for(const k of Object.keys(PTS)) delete PTS[k];   // 새 자료로 그래프를 다시 받음
    render(); if(keep) scrollTo(0, y);
    if((D.refresh||{}).running && !POLL) startPoll();
  }catch(err){
    $("#main").innerHTML = `<div class="empty"><b>매크로 지표를 불러오지 못했습니다</b><span>${esc(err.message)} — 잠시 후 새로고침하세요.</span></div>`;
  }
}
header(); load();
</script>
